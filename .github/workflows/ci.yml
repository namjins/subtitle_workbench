name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # Windows is included deliberately: the OCR pipeline could not start there
    # at all until recently, and that class of bug is invisible from macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install subtitle tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick tesseract-ocr mkvtoolnix

      - name: Install subtitle tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg imagemagick tesseract mkvtoolnix

      - name: Install subtitle tooling (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ffmpeg imagemagick tesseract mkvtoolnix
          # choco writes these installers' locations to the machine PATH,
          # which later workflow steps do not inherit. ffmpeg and ImageMagick
          # get chocolatey shims and are visible anyway; tesseract and
          # MKVToolNix do not, so without this the OCR end-to-end tests
          # silently skip and Windows CI proves much less than it appears to.
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Tesseract-OCR'
          Add-Content $env:GITHUB_PATH 'C:\Program Files\MKVToolNix'
        shell: pwsh

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Exercises the CLI against the committed fixtures. The OCR-text
      # assertions skip themselves where the tools are unavailable; the decode
      # assertions always run.
      - run: npm test

      - name: Dependency report
        run: node tools/subtitle-workbench.mjs doctor || true

      # The desktop shell had zero automated verification — the Windows
      # .cmd-resolution bug shipped precisely because nothing ever compiled
      # src-tauri off the author's machine. A compile check is not a release
      # build (signing/notarization stays deferred, see the roadmap), but it
      # turns "it compiled once locally" into a standing guarantee on all
      # three platforms.
      - name: Install Tauri build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile-check the desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
